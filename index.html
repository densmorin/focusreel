<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FocusReel</title>
  
  <!-- Optimisation iPhone PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FocusReel">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111827'/><polygon points='40,30 70,50 40,70' fill='%2360a5fa'/></svg>">

  <style>
    :root {
      --bg: #0b0f19;
      --card: #161e2e;
      --border: #2e384d;
      --accent: #3b82f6;
      --danger: #ef4444;
      --text: #f9fafb;
      --subtext: #9ca3af;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 440px;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.65rem;
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .controls {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="url"] {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="url"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button.secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--subtext);
    }

    button.danger {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    /* Conteneur 9:16 anti-doomscroll */
    .player-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--subtext);
      font-size: 0.85rem;
    }

    /* Bouclier anti-clics pour bloquer les boutons "Suivant / Voir plus" */
    .shield-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: transparent;
      z-index: 5;
      pointer-events: auto;
    }

    .status-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 0 4px;
      font-size: 0.8rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <header>
    <h1>FocusReel <span class="badge">Anti-Feed</span></h1>
    <button class="danger" id="closeBtn" style="padding: 6px 10px; font-size: 0.75rem; display: none;">Fermer la vidéo</button>
  </header>

  <div class="controls">
    <div class="input-row">
      <input type="url" id="videoUrl" placeholder="Collez le lien Reel, TikTok, Short...">
      <button id="pasteBtn" class="secondary" title="Coller">Coller</button>
      <button id="loadBtn">Lire</button>
    </div>
  </div>

  <div class="player-container">
    <div class="empty-state" id="emptyState">
      Collez un lien pour visionner la vidéo sans recommandations ni défilement infini.
    </div>
    <iframe id="videoFrame" style="display: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <!-- Masque transparent empêchant de cliquer sur les profils ou vidéos suggérées du bas -->
    <div class="shield-bottom" id="shield" style="display: none;"></div>
  </div>

  <div class="status-bar">
    <span id="platformLabel">Prêt</span>
    <span id="timerLabel"></span>
  </div>

  <script>
    const urlInput = document.getElementById('videoUrl');
    const loadBtn = document.getElementById('loadBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const closeBtn = document.getElementById('closeBtn');
    const frame = document.getElementById('videoFrame');
    const emptyState = document.getElementById('emptyState');
    const shield = document.getElementById('shield');
    const platformLabel = document.getElementById('platformLabel');

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        urlInput.value = text;
        loadVideo();
      } catch (err) {
        urlInput.focus();
      }
    });

    loadBtn.addEventListener('click', loadVideo);

    closeBtn.addEventListener('click', unloadVideo);

    function unloadVideo() {
      frame.src = 'about:blank';
      frame.style.display = 'none';
      shield.style.display = 'none';
      closeBtn.style.display = 'none';
      emptyState.style.display = 'block';
      urlInput.value = '';
      platformLabel.innerText = 'Prêt';
    }

    function extractEmbedUrl(url) {
      if (!url) return null;

      // YouTube Shorts
      const ytMatch = url.match(/(?:shorts\/|youtu\.be\/|v=)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        platformLabel.innerText = 'YouTube Short';
        return `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1&rel=0&modestbranding=1`;
      }

      // Instagram Reels / Posts
      const igMatch = url.match(/instagram\.com\/(?:reel|p)\/([a-zA-Z0-9_-]+)/);
      if (igMatch) {
        platformLabel.innerText = 'Instagram Reel';
        return `https://www.instagram.com/reel/${igMatch[1]}/embed/`;
      }

      // TikTok
      const ttMatch = url.match(/tiktok\.com\/.*video\/(\d+)/);
      if (ttMatch) {
        platformLabel.innerText = 'TikTok Video';
        return `https://www.tiktok.com/embed/v2/${ttMatch[1]}`;
      }

      // Facebook Reels / Videos
      if (url.includes('facebook.com')) {
        platformLabel.innerText = 'Facebook Video';
        return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=0`;
      }

      return null;
    }

    function loadVideo() {
      const rawUrl = urlInput.value.trim();
      const embedUrl = extractEmbedUrl(rawUrl);

      if (!embedUrl) {
        alert("Lien non reconnu. Formats supportés : YouTube Shorts, Instagram Reels, TikTok, Facebook.");
        return;
      }

      emptyState.style.display = 'none';
      frame.src = embedUrl;
      frame.style.display = 'block';
      shield.style.display = 'block';
      closeBtn.style.display = 'block';
    }
  </script>
</body>
</html>
